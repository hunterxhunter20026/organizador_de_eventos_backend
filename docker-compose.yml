services:
  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: 1
      POSTGRES_PASSWORD: 1
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - archetype_net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - archetype_net

networks:
  archetype_net:
    driver: bridge

volumes:
  db_data:
